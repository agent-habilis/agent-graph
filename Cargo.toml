[workspace]
members = ["crates/*", "tasks"]
default-members = ["crates/agent-graph"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Caio Gondim <me@caiogondim.com>"]
license = "MIT"

[workspace.dependencies]
agent-graph-core = { path = "crates/agent-graph-core" }
agent-graph-topology = { path = "crates/agent-graph-topology" }
# agent-habilis/render, for its Mermaid renderer. Pinned to a commit until it
# is on crates.io.
agent-habilis-render = { git = "ssh://git@github.com/agent-habilis/render.git", rev = "a0eb8f61adabc6468da8b3acd05bc2d88598ee9e" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1.0.151"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Use render's fork of figurehead, not the crates.io release: render's own
# [patch.crates-io] does not apply to a dependency. Keep `rev` equal to the
# render rev in [workspace.dependencies] above.
[patch.crates-io]
figurehead = { git = "ssh://git@github.com/agent-habilis/render.git", rev = "a0eb8f61adabc6468da8b3acd05bc2d88598ee9e" }
