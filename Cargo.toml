[workspace]
members = ["tasks"]

[package]
name = "agent-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "Find and print agent graphs: OKF bundles in .agent-graph/ folders from cwd up to /."
license = "MIT"
readme = "README.md"
keywords = ["agents", "graph", "okf"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"

[[bin]]
name = "agent-graph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
