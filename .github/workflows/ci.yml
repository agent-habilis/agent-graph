name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # No rust-toolchain.toml, so this installs stable. It also caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      # `cargo task ci` formats with this exact nightly (tasks/src/fmt.rs).
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt

      - name: Gate
        run: cargo task ci

  # The same gate on Windows. A job of its own, so the check above keeps its
  # name. The runner has Git for Windows, whose bash the skills tests run.
  windows:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt

      - name: Gate
        run: cargo task ci
